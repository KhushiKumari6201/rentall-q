version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rentall_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rentall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentall_secret}
      POSTGRES_DB: ${POSTGRES_DB:-rentall_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentall} -d ${POSTGRES_DB:-rentall_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rentall_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  agents-service:
    build:
      context: ./agents-service
      dockerfile: Dockerfile
    container_name: rentall_agents_service
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./agents-service:/app
    environment:
      - PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - redis

  nextjs-app:
    build:
      context: ./nextjs-app
      dockerfile: Dockerfile
    container_name: rentall_nextjs_app
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./nextjs-app:/app
      - /app/node_modules
      - /app/.next
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-rentall}:${POSTGRES_PASSWORD:-rentall_secret}@postgres:5432/${POSTGRES_DB:-rentall_db}?schema=public
      - AGENTS_SERVICE_URL=http://agents-service:8000
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-secret}
    depends_on:
      postgres:
        condition: service_healthy
      agents-service:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
